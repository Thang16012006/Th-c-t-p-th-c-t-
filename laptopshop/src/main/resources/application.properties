spring.application.name=laptopshop
# Kết nối database
spring.datasource.url=jdbc:h2:file:./data/laptopshopdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Bật H2 console để kiểm tra dữ liệu (http://localhost:9090/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cấu hình Hibernate (để tự động tạo bảng)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=9090