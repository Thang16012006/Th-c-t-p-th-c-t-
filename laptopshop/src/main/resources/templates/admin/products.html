<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECH-PC Admin | Quản lý Sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8f9fa;
        }
        .sidebar {
            background-color: #111827;
            min-height: 100vh;
            color: #9ca3af;
        }
        .sidebar .nav-link {
            color: #9ca3af;
            transition: all 0.3s ease;
            border-radius: 8px;
            margin-bottom: 5px;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            color: #ffffff;
            background-color: #1f2937;
        }
        .main-content {
            padding: 30px;
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            background: #ffffff;
        }
        .table {
            vertical-align: middle;
        }
        .table thead th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            color: #6b7280;
            border-bottom: 2px solid #f3f4f6;
            padding: 15px 20px;
        }
        .table tbody td {
            padding: 15px 20px;
            border-bottom: 1px solid #f3f4f6;
        }
        .product-thumb {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
        .btn-action {
            border-radius: 8px;
            transition: all 0.2s;
        }
        .btn-action:hover {
            transform: translateY(-2px);
        }
        .search-bar {
            border-radius: 10px;
            border: 1px solid #e5e7eb;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Fragment -->
            <div th:replace="~{fragments/admin-sidebar :: adminSidebar('products')}"></div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 main-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold text-dark">Quản lý Sản phẩm</h2>
                        <p class="text-muted mb-0">Thêm, sửa, xóa và theo dõi danh sách sản phẩm của cửa hàng</p>
                    </div>
                    <a href="/admin/products/new" class="btn btn-primary px-4 py-2 btn-action fw-semibold">
                        <i>➕</i> Thêm sản phẩm mới
                    </a>
                </div>

                <div class="card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="fw-bold mb-0">Danh sách Sản phẩm</h5>
                        <div class="d-flex gap-2">
                            <input type="text" id="productSearch" class="form-control search-bar px-3 py-2" placeholder="Tìm theo tên sản phẩm..." style="width: 300px;">
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table" id="productsTable">
                            <thead>
                                <tr>
                                    <th>Hình ảnh</th>
                                    <th>Tên sản phẩm</th>
                                    <th>Danh mục</th>
                                    <th>Thương hiệu</th>
                                    <th>Giá bán</th>
                                    <th>Hot?</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="product : ${products}">
                                    <td>
                                        <img th:src="${product.imageUrl}" class="product-thumb" alt="Product Image">
                                    </td>
                                    <td>
                                        <div class="fw-semibold text-dark" th:text="${product.name}">ASUS ROG Strix G16</div>
                                        <div class="text-muted small text-truncate" style="max-width: 300px;" th:text="${product.description}">Mô tả</div>
                                    </td>
                                    <td>
                                        <span class="badge bg-secondary px-2.5 py-1.5 rounded-pill" th:text="${product.category}">LAPTOP</span>
                                    </td>
                                    <td class="fw-medium text-dark" th:text="${product.brand}">ASUS</td>
                                    <td class="fw-bold text-primary" th:text="${T(java.lang.String).format('%,.0f', product.price)} + ' đ'">10.000 đ</td>
                                    <td>
                                        <span th:if="${product.isHot}" class="badge bg-danger">HOT🔥</span>
                                        <span th:if="${!product.isHot}" class="text-muted small">—</span>
                                    </td>
                                    <td>
                                        <div class="d-flex gap-2">
                                            <a th:href="@{/admin/products/{id}/edit(id=${product.id})}" class="btn btn-outline-primary btn-sm btn-action">Sửa</a>
                                            <form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="POST" onsubmit="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này không?')">
                                                <button type="submit" class="btn btn-outline-danger btn-sm btn-action">Xóa</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('productSearch').addEventListener('input', function() {
            let filter = this.value.toUpperCase();
            let rows = document.querySelector("#productsTable tbody").rows;
            for (let i = 0; i < rows.length; i++) {
                let nameCol = rows[i].cells[1].innerText;
                if (nameCol.toUpperCase().indexOf(filter) > -1) {
                    rows[i].style.display = "";
                } else {
                    rows[i].style.display = "none";
                }
            }
        });
    </script>
</body>
</html>
