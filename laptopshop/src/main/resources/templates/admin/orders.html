<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECH-PC Admin | Quản lý Đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8f9fa;
        }
        .sidebar {
            background-color: #111827;
            min-height: 100vh;
            color: #9ca3af;
        }
        .sidebar .nav-link {
            color: #9ca3af;
            transition: all 0.3s ease;
            border-radius: 8px;
            margin-bottom: 5px;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            color: #ffffff;
            background-color: #1f2937;
        }
        .main-content {
            padding: 30px;
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            background: #ffffff;
        }
        .table {
            vertical-align: middle;
        }
        .table thead th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            color: #6b7280;
            border-bottom: 2px solid #f3f4f6;
            padding: 15px 20px;
        }
        .table tbody td {
            padding: 15px 20px;
            border-bottom: 1px solid #f3f4f6;
        }
        .badge-status {
            padding: 6px 12px;
            border-radius: 9999px;
            font-weight: 500;
            font-size: 0.85rem;
        }
        .badge-pending { background-color: #fef3c7; color: #d97706; }
        .badge-confirmed { background-color: #e0e7ff; color: #4f46e5; }
        .badge-shipped { background-color: #e0f2fe; color: #0284c7; }
        .badge-delivered { background-color: #dcfce7; color: #15803d; }
        .badge-cancelled { background-color: #fee2e2; color: #b91c1c; }
        
        .btn-action {
            border-radius: 8px;
            transition: all 0.2s;
        }
        .btn-action:hover {
            transform: translateY(-2px);
        }
        .search-bar {
            border-radius: 10px;
            border: 1px solid #e5e7eb;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div th:replace="~{fragments/admin-sidebar :: adminSidebar('orders')}"></div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 main-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold text-dark">Quản lý Đơn hàng</h2>
                        <p class="text-muted mb-0">Theo dõi, cập nhật trạng thái đơn hàng của hệ thống</p>
                    </div>
                </div>

                <div class="card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="fw-bold mb-0">Danh sách Đơn hàng</h5>
                        <div class="d-flex gap-2">
                            <input type="text" id="orderSearch" class="form-control search-bar px-3 py-2" placeholder="Tìm theo tên khách hàng..." style="width: 250px;">
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table" id="ordersTable">
                            <thead>
                                <tr>
                                    <th>Mã ĐH</th>
                                    <th>Khách hàng</th>
                                    <th>Điện thoại</th>
                                    <th>Ngày đặt</th>
                                    <th>Tổng tiền</th>
                                    <th>Trạng thái</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="order : ${orders}">
                                    <td class="fw-bold text-secondary" th:text="'#' + ${order.id}">#1</td>
                                    <td>
                                        <div class="fw-semibold text-dark" th:text="${order.customerName}">Nguyễn Văn A</div>
                                        <div class="text-muted small" th:text="${order.customerEmail}">a@example.com</div>
                                    </td>
                                    <td th:text="${order.customerPhone}">0901234567</td>
                                    <td th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}">20/06/2026 12:00</td>
                                    <td class="fw-bold text-primary" th:text="${T(java.lang.String).format('%,.0f', order.totalAmount)} + ' VNĐ'">100.000 VNĐ</td>
                                    <td>
                                        <span th:if="${order.status == 'PENDING'}" class="badge-status badge-pending">Chờ xử lý</span>
                                        <span th:if="${order.status == 'CONFIRMED'}" class="badge-status badge-confirmed">Đã xác nhận</span>
                                        <span th:if="${order.status == 'SHIPPED'}" class="badge-status badge-shipped">Đang giao</span>
                                        <span th:if="${order.status == 'DELIVERED'}" class="badge-status badge-delivered">Đã giao</span>
                                        <span th:if="${order.status == 'CANCELLED'}" class="badge-status badge-cancelled">Đã hủy</span>
                                    </td>
                                    <td>
                                        <a th:href="@{/admin/orders/{id}(id=${order.id})}" class="btn btn-primary btn-sm btn-action me-2">Chi tiết</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('orderSearch').addEventListener('input', function() {
            let filter = this.value.toUpperCase();
            let rows = document.querySelector("#ordersTable tbody").rows;
            for (let i = 0; i < rows.length; i++) {
                let nameCol = rows[i].cells[1].innerText;
                if (nameCol.toUpperCase().indexOf(filter) > -1) {
                    rows[i].style.display = "";
                } else {
                    rows[i].style.display = "none";
                }
            }
        });
    </script>
</body>
</html>
