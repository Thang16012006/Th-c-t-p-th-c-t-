<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECH-PC Admin | Form Sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8f9fa;
        }
        .sidebar {
            background-color: #111827;
            min-height: 100vh;
            color: #9ca3af;
        }
        .sidebar .nav-link {
            color: #9ca3af;
            transition: all 0.3s ease;
            border-radius: 8px;
            margin-bottom: 5px;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            color: #ffffff;
            background-color: #1f2937;
        }
        .main-content {
            padding: 30px;
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            background: #ffffff;
        }
        .btn-action {
            border-radius: 8px;
            transition: all 0.2s;
        }
        .btn-action:hover {
            transform: translateY(-2px);
        }
        .image-preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            object-fit: cover;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div th:replace="~{fragments/admin-sidebar :: adminSidebar('products')}"></div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 main-content">
                <div class="mb-4">
                    <a href="/admin/products" class="btn btn-outline-secondary btn-sm btn-action mb-2">← Trở lại danh sách</a>
                    <h2 class="fw-bold text-dark" th:text="${pageTitle}">Thêm/Sửa Sản phẩm</h2>
                </div>

                <div class="card p-4" style="max-width: 800px;">
                    <form th:action="@{/admin/products}" th:object="${product}" method="POST">
                        <!-- ID ẩn để cập nhật đúng sản phẩm -->
                        <input type="hidden" th:field="*{id}" />

                        <div class="row">
                            <div class="col-md-8">
                                <div class="mb-3">
                                    <label for="name" class="form-label fw-semibold">Tên sản phẩm <span class="text-danger">*</span></label>
                                    <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Nhập tên sản phẩm..." required>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="price" class="form-label fw-semibold">Giá bán (VNĐ) <span class="text-danger">*</span></label>
                                    <input type="number" id="price" th:field="*{price}" class="form-control" placeholder="Ví dụ: 15000000" min="0" required>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="category" class="form-label fw-semibold">Danh mục <span class="text-danger">*</span></label>
                                    <select id="category" th:field="*{category}" class="form-select" required>
                                        <option value="">-- Chọn danh mục --</option>
                                        <option value="LAPTOP">LAPTOP</option>
                                        <option value="CPU">CPU (Linh kiện)</option>
                                        <option value="GPU">GPU (Card màn hình)</option>
                                        <option value="RAM">RAM (Bộ nhớ trong)</option>
                                        <option value="MAINBOARD">MAINBOARD (Bo mạch chủ)</option>
                                        <option value="POWER_SUPPLY">POWER SUPPLY (Nguồn)</option>
                                        <option value="KEYBOARD">KEYBOARD (Bàn phím)</option>
                                        <option value="MOUSE">MOUSE (Chuột)</option>
                                        <option value="MONITOR">MONITOR (Màn hình)</option>
                                        <option value="PC_GAMING">PC GAMING (Máy bộ Gaming)</option>
                                        <option value="PC_WORKSTATION">PC WORKSTATION (Máy bộ Đồ họa)</option>
                                        <option value="PC_OFFICE">PC OFFICE (Máy bộ Văn phòng)</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="brand" class="form-label fw-semibold">Thương hiệu <span class="text-danger">*</span></label>
                                    <input type="text" id="brand" th:field="*{brand}" class="form-control" placeholder="Ví dụ: ASUS, Dell, Apple, MSI..." required>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="imageUrl" class="form-label fw-semibold">Đường dẫn hình ảnh <span class="text-danger">*</span></label>
                            <input type="url" id="imageUrl" th:field="*{imageUrl}" class="form-control" placeholder="https://example.com/image.jpg" required>
                            <div class="mt-3">
                                <img id="preview" class="image-preview" src="#" alt="Preview Image">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label fw-semibold">Mô tả sản phẩm</label>
                            <textarea id="description" th:field="*{description}" class="form-control" rows="4" placeholder="Nhập thông số cấu hình và mô tả chi tiết..."></textarea>
                        </div>

                        <div class="mb-4">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="isHot" th:field="*{isHot}">
                                <label class="form-check-label fw-semibold" for="isHot">Đánh dấu sản phẩm HOT (Nổi bật)</label>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4 py-2 btn-action fw-semibold">Lưu sản phẩm</button>
                            <a href="/admin/products" class="btn btn-outline-secondary px-4 py-2 btn-action">Hủy bỏ</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const imageInput = document.getElementById('imageUrl');
        const preview = document.getElementById('preview');

        function updatePreview() {
            const url = imageInput.value;
            if (url && (url.startsWith('http://') || url.startsWith('https://'))) {
                preview.src = url;
                preview.style.display = 'block';
            } else {
                preview.style.display = 'none';
            }
        }

        imageInput.addEventListener('input', updatePreview);
        // Run on load to show preview when editing
        window.addEventListener('DOMContentLoaded', updatePreview);
    </script>
</body>
</html>
