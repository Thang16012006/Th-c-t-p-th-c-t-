<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TECH-PC | Kết quả tìm kiếm</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: 'Outfit', "Segoe UI", system-ui, -apple-system, sans-serif;
        background: #eef1f7;
      }
      .site-header {
        background: white;
        box-shadow: 0 2px 8px rgba(16, 24, 40, 0.04);
      }
      .product-card {
        border: 0;
        border-radius: 16px;
        overflow: hidden;
        background: #fff;
        box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .product-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 12px 30px rgba(13, 110, 253, 0.12);
      }
      .product-img-wrapper {
        height: 200px;
        overflow: hidden;
        position: relative;
        background: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .product-img {
        max-height: 100%;
        max-width: 100%;
        object-fit: contain;
        padding: 12px;
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .product-card:hover .product-img {
        transform: scale(1.08);
      }
      .price {
        color: #0d6efd;
        font-size: 1.15rem;
        font-weight: 700;
      }
      .original-price {
        text-decoration: line-through;
        color: #9ca3af;
        font-size: 0.85rem;
        margin-right: 6px;
      }
      .discount-badge {
        background-color: #ef4444;
        color: white;
        font-weight: 700;
        font-size: 0.75rem;
        padding: 4px 8px;
        border-radius: 8px;
        position: absolute;
        right: 12px;
        top: 12px;
        z-index: 10;
        box-shadow: 0 4px 10px rgba(239, 68, 68, 0.25);
      }
      .hot-badge {
        background-color: #f97316;
        color: white;
        font-weight: 700;
        font-size: 0.75rem;
        padding: 4px 8px;
        border-radius: 8px;
        position: absolute;
        left: 12px;
        top: 12px;
        z-index: 10;
        box-shadow: 0 4px 10px rgba(249, 115, 22, 0.25);
      }
      .rating-stars {
        color: #f59e0b;
        font-size: 0.8rem;
      }
      .promo-tag {
        font-size: 0.7rem;
        font-weight: 500;
        padding: 3px 8px;
        border-radius: 6px;
        background-color: #f1f5f9;
        color: #475569;
        display: inline-flex;
        align-items: center;
        gap: 3px;
        margin-right: 4px;
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header th:replace="~{fragments/header :: header}"></header>

    <header class="container mb-4 mt-4">
      <div class="bg-dark text-white rounded-4 overflow-hidden position-relative shadow-sm" style="height: 120px;">
        <div class="position-absolute top-0 start-0 w-100 h-100" style="background: linear-gradient(135deg, rgba(31,95,224,0.85) 0%, rgba(13,148,136,0.3) 100%); z-index: 1;"></div>
        <div class="position-relative p-4 d-flex flex-column justify-content-center h-100" style="z-index: 2;">
          <h3 class="fw-bold mb-1">KẾT QUẢ TÌM KIẾM</h3>
          <p class="text-light opacity-90 m-0 small" th:text="'Tìm thấy các sản phẩm phù hợp với từ khóa: &ldquo;' + ${searchQuery} + '&rdquo;'"></p>
        </div>
      </div>
    </header>

    <main class="container pb-5">
      <!-- If empty -->
      <div th:if="${products.isEmpty()}" class="card p-5 text-center border-0 rounded-4 shadow-sm">
        <div class="py-5">
          <i class="fs-1 text-muted d-block mb-3">🔍</i>
          <h4 class="text-secondary fw-semibold">Không tìm thấy sản phẩm nào</h4>
          <p class="text-muted">Thử tìm kiếm với từ khóa khác như "RTX", "Core i9", "MacBook", "Keyboard"...</p>
          <a href="/" class="btn btn-primary px-4 mt-3 rounded-pill">Quay lại Trang chủ</a>
        </div>
      </div>

      <!-- Grid of search results -->
      <div th:unless="${products.isEmpty()}" class="row g-4">
        <div class="col-md-6 col-lg-3" th:each="p : ${products}">
          <div class="card product-card h-100">
            <a th:href="@{/product/{id}(id=${p.id})}" class="text-decoration-none">
              <div class="product-img-wrapper">
                <img th:src="${p.imageUrl}" class="product-img" alt="" />
                <span th:if="${p.isHot}" class="hot-badge">HOT</span>
                <span class="discount-badge">-15%</span>
              </div>
            </a>
            <div class="card-body d-flex flex-column">
              <div class="rating-stars mb-2">★★★★★ <span class="text-muted small ms-1">(24)</span></div>
              <h5 class="card-title fw-bold text-dark mb-1">
                <a th:href="@{/product/{id}(id=${p.id})}" class="text-decoration-none text-dark" th:text="${p.name}">Sản phẩm</a>
              </h5>
              <p class="text-muted small mb-3" th:text="${p.description}">Mô tả</p>
              <div class="mb-3 mt-auto">
                <span class="promo-tag">🚚 Freeship</span>
                <span class="promo-tag">💳 Trả góp 0%</span>
              </div>
              <div class="d-flex justify-content-between align-items-center mt-2">
                <div>
                  <span class="original-price" th:text="${T(java.lang.String).format('%,.0f', p.price * 1.15)} + ' đ'">0 đ</span>
                  <div class="price text-primary" th:text="${T(java.lang.String).format('%,.0f', p.price)} + ' đ'">0 đ</div>
                </div>
                <form th:action="@{/cart/add}" method="POST" class="m-0">
                  <input type="hidden" name="productId" th:value="${p.id}" />
                  <button type="submit" class="btn btn-primary btn-sm px-3 rounded-pill">Mở giỏ</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <div th:replace="~{fragments/widget :: widget}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
