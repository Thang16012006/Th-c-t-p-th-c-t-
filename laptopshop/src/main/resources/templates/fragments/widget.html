<div th:fragment="widget">
  <style>
    .floating-contact-widget {
      position: fixed;
      right: 24px;
      bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 9999;
    }
    .contact-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }
    .contact-btn:hover {
      transform: translateY(-6px) scale(1.08);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.24);
    }
    .btn-ai-chat {
      background: linear-gradient(135deg, #ff7e40 0%, #ff5411 100%);
    }
    .btn-whatsapp {
      background: #4caf50;
    }
    .btn-zalo {
      background: #0084ff;
    }
    .contact-btn svg {
      width: 32px;
      height: 32px;
      transition: transform 0.3s ease;
    }
    .contact-btn:hover svg {
      transform: scale(1.1);
    }
  </style>
  <div class="floating-contact-widget">
    <!-- Orange Chat Button (AI Consultant) -->
    <a href="/ai-consultant" class="contact-btn btn-ai-chat" title="Trợ lý ảo AI">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
