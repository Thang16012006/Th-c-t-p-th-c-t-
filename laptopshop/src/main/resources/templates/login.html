<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>TECH-PC Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f4f7f6;
      }
      .login-container {
        width: 1000px;
        height: 800px;
        background: white;
        border-radius: 20px;
        display: flex;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }
      .left-side {
        flex: 1;
        background: #1a1a1a;
        color: white;
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .right-side {
        flex: 1;
        padding: 60px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .btn-login {
        background-color: #0056b3;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="left-side">
        <h2>Experience Peak Performance.</h2>
        <p>
          Join the community of professionals and enthusiasts building the
          future of computing with TECH-PC.
        </p>
      </div>

      <div class="right-side">
        <h3 class="fw-bold">Welcome back</h3>
        <p class="text-muted">
          Please enter your credentials to access your account.
        </p>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${loginError}" class="alert alert-danger" th:text="${loginError}"></div>
        <form action="/login" method="post">
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input
              type="email"
              name="username"
              class="form-control"
              placeholder="name@company.com"
            />
          </div>
          <div class="mb-3">
            <div class="d-flex justify-content-between">
              <label class="form-label">Password</label>
              <a href="#" class="text-decoration-none small">Forgot password?</a>
            </div>
            <input
              type="password"
              name="password"
              class="form-control"
              placeholder="••••••••"
            />
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="remember" />
            <label class="form-check-label small" for="remember"
              >Remember me for 30 days</label
            >
          </div>
          <button type="submit" class="btn btn-login w-100 py-2">
            Login to Account
          </button>
        </form>

        <div class="mt-4 text-center">
          <p class="text-muted small">Or continue with</p>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary w-50">Google</button>
            <button class="btn btn-outline-secondary w-50">Facebook</button>
          </div>
          <p class="mt-3 small">
            Don't have an account? <a href="/register">Create account</a>
          </p>
        </div>
      </div>
    </div>
  
<div th:replace="~{fragments/widget :: widget}"></div>

</body>
</html>
